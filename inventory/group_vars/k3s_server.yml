---
# Applications déployées via Helm (rôle helm_apps).
# Chaque entrée = une release. Les values vont dans apps/values/<name>.yml
helm_releases:
  - name: whoami
    chart: cowboysysop/whoami
    repo_name: cowboysysop
    repo_url: https://cowboysysop.github.io/charts
    namespace: demo
    values_file: whoami.yml
    state: present

  # Expose le GPU aux pods (ressource nvidia.com/gpu). Nécessite le rôle nvidia_cuda + RuntimeClass nvidia.
  - name: nvidia-device-plugin
    chart: nvdp/nvidia-device-plugin
    repo_name: nvdp
    repo_url: https://nvidia.github.io/k8s-device-plugin
    version: "0.20.1"
    namespace: nvidia-device-plugin
    values_file: nvidia-device-plugin.yml
    state: present

  # --- SSO : Keycloak (realm "homelab" importé par le rôle platform) ---
  - name: keycloak
    chart: codecentric/keycloakx
    repo_name: codecentric
    repo_url: https://codecentric.github.io/helm-charts
    version: "7.4.0"
    namespace: keycloak
    values_file: keycloak.yml
    state: present

  # --- GitOps : Argo CD (login via Keycloak) ---
  - name: argocd
    chart: argo/argo-cd
    repo_name: argo
    repo_url: https://argoproj.github.io/argo-helm
    version: "10.18.0"
    namespace: argocd
    values_file: argocd.yml
    state: present
