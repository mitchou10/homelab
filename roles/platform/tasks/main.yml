---
# Prépare tout ce dont dépendent Keycloak et Argo CD AVANT leur déploiement Helm :
# DNS interne, namespaces, secrets, Postgres, realm Keycloak.

# Pourquoi un enregistrement A et pas un "rewrite" CoreDNS : un rewrite renvoie la réponse sous le nom de la cible
# (traefik.kube-system...) et non sous le nom demandé. Les clients Go l'acceptent, mais le résolveur glibc (Python, curl...)
# l'ignore : « Name or service not known ». Ici la réponse porte le bon nom.
- name: IP de Traefik (cible de *.{{ homelab_domain }} dans le cluster)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_kubeconfig }}"
    api_version: v1
    kind: Service
    name: traefik
    namespace: kube-system
  register: traefik_svc

- name: DNS interne - *.{{ homelab_domain }} résolu vers Traefik dans le cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_kubeconfig }}"
    state: present
    force: true              # remplace la ConfigMap (retire l'ancienne clé homelab.override)
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns-custom
        namespace: kube-system
      data:
        homelab.server: |
          {{ homelab_domain }}:53 {
              errors
              cache 30
              template IN A {
                  answer "{% raw %}{{ .Name }}{% endraw %} 60 IN A {{ traefik_svc.resources[0].spec.clusterIP }}"
              }
              # pas d'IPv6 : réponse vide (NODATA) plutôt qu'une erreur qui ferait échouer le résolveur
              template IN AAAA {
                  rcode NOERROR
              }
          }
  register: coredns_custom

- name: Redémarrer CoreDNS pour prendre en compte la config
  ansible.builtin.command: k3s kubectl -n kube-system rollout restart deployment/coredns
  when: coredns_custom.changed
  changed_when: true

- name: Namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: [keycloak, argocd]

- name: Secrets Keycloak (admin, base de données, realm)
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
        namespace: keycloak
      type: Opaque
      stringData: "{{ item.data }}"
  loop:
    - { name: keycloak-admin, data: { password: "{{ keycloak_admin_password }}" } }
    - { name: keycloak-db, data: { password: "{{ keycloak_db_password }}" } }
    - { name: keycloak-realm, data: { homelab-realm.json: "{{ lookup('template', 'realm-homelab.json.j2') }}" } }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Postgres pour Keycloak
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'postgres.yml.j2') | from_yaml_all | list }}"
