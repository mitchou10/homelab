name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases on the same branch at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: Mitchou10/github-workflow/.github/workflows/release-please.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      ENABLE_PRERELEASE: false # une seule branche : main = versions stables
      TAG_MAJOR_AND_MINOR: false
